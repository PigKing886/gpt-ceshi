<div class="controls"><button id="pause" type="button" aria-pressed="false">暂停骑行</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.25" max="2" value="1" step="0.05"><output id="value">1.0×</output></label><span class="note">一只鹈鹕，一辆单车，一路海风。 · 空格键暂停</span></div></main>
<script>
(()=>{'use strict';const el=id=>document.getElementById(id);let running=true,speed=1,last=0,t=0;const set=(id,a,v)=>el(id).setAttribute(a,v), point=(x,y)=>`${x.toFixed(2)} ${y.toFixed(2)}`;
// 两段式腿部逆运动学：脚掌固定在脚踏上，膝关节连续弯曲。
function leg(hx,hy,fx,fy){const dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy),a=76,b=78,q=(a*a-b*b+d*d)/(2*d),h=Math.sqrt(Math.max(0,a*a-q*q));return `M${point(hx,hy)} L${point(hx+q*dx/d+h*dy/d,hy+q*dy/d-h*dx/d)} L${point(fx,fy)}`}
function draw(){const angle=t*2.6,deg=angle*180/Math.PI,travel=angle*2.1*82;set('rear','transform',`rotate(${deg*2.1})`);set('front','transform',`rotate(${deg*2.1})`);set('gear','transform',`rotate(${deg} 571 479)`);set('road','patternTransform',`translate(${-travel%160} 0)`);set('ripples','patternTransform',`translate(${-travel*.13%240} 0)`);set('plants','transform',`translate(${-travel%1500} 0)`);set('clouds','transform',`translate(${-travel*.025%1300} 0)`);set('boat','transform',`translate(${-travel*.075%1300} ${Math.sin(t)*2})`);
const bounce=Math.sin(angle*2)*1.7;set('bird','transform',`translate(0 ${bounce})`);for(const near of [false,true]){const a=angle+(near?0:Math.PI),x=571+34*Math.cos(a),y=479+34*Math.sin(a),suffix=near?'Near':'Far';set('crank'+suffix,'d',`M571 479L${point(x,y)}`);set('pedal'+suffix,'d',`M${point(x-14,y+5)}h28`);const path=leg(near?543:528,350+bounce,x,y-5);if(near){set('legNear','d',path);set('legNearInner','d',path);set('footNear','d',`M${point(x-9,y-9)}q9-4 15 1l14 8h-34Z`)}else set('legFar','d',path)}
set('scarfTail','d',`M621 250Q582 ${229+Math.sin(angle*1.7)*7} 541 ${246+Math.sin(angle*1.7+1)*9}L553 ${262+Math.sin(angle*1.7+1)*9}Q585 ${247+Math.sin(angle*1.7)*7} 624 261Z`);const blink=t%5.2;set('eye','transform',blink>4.95&&blink<5.09?'translate(0 181) scale(1 .1)':'');set('wind1','opacity',.4+.3*Math.sin(t*2));set('wind2','opacity',.4+.3*Math.cos(t*2));}
// 复制前景植物，使滚动跨越画布边界时保持连续。
const plants=el('plants');const originals=Array.from(plants.children);for(const offset of [1500,3000])for(const node of originals){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform',`translate(${offset} 0)`);g.appendChild(node.cloneNode(true));plants.appendChild(g)}
function frame(now){if(last&&running)t+=Math.min((now-last)/1000,.05)*speed;last=now;draw();requestAnimationFrame(frame)}function toggle(){running=!running;el('pause').textContent=running?'暂停骑行':'继续骑行';el('pause').setAttribute('aria-pressed',String(!running))}el('pause').addEventListener('click',toggle);el('speed').addEventListener('input',e=>{speed=Number(e.target.value);el('value').value=speed.toFixed(2).replace(/0$/,'')+'×'});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggle()}});document.addEventListener('visibilitychange',()=>{last=0});requestAnimationFrame(frame);
})();
</script></body></html>
